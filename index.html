<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17212b"><meta name="description" content="NANDO Messenger — مراسلة عربية"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>NANDO — Messenger</title></head><body><div class="app"><aside class="sidebar"><header class="topbar"><button class="icon" id="menuBtn">☰</button><div class="brand"><span class="brandmark">N</span><b>NANDO</b></div><button class="icon" id="newChat">＋</button></header><div class="search"><span>⌕</span><input id="search" placeholder="بحث" autocomplete="off"></div><nav class="filters"><button class="filter active" data-filter="all">الكل</button><button class="filter" data-filter="unread">غير مقروءة</button><button class="filter" data-filter="groups">مجموعات</button></nav><div class="chatlist" id="chatList"></div><footer class="sidefoot"><span class="online-dot"></span> مراسلة سريعة — نسخة تجريبية</footer></aside><main class="conversation"><section class="welcome" id="welcome"><div class="welcome-logo">N</div><h1>مرحباً بك في NANDO</h1><p>مراسلاتك، مجموعاتك وملفاتك في مكان واحد.</p><small>اختر محادثة للبدء</small></section><section class="thread hidden" id="thread"><header class="thread-head"><button class="icon back" id="backBtn">‹</button><div class="avatar" id="headAvatar"></div><div class="person"><b id="headName"></b><small id="headStatus">محادثة شخصية</small></div><button class="icon" aria-label="بحث">⌕</button><button class="icon" aria-label="المزيد">⋮</button></header><div class="messages" id="messages"></div><form class="composer" id="sendForm"><button type="button" class="icon attach" id="attachBtn">＋</button><input id="messageInput" placeholder="اكتب رسالة..." autocomplete="off"><button class="send" aria-label="إرسال">➤</button><input type="file" id="fileInput" hidden></form></section></main></div><script src="app.js"></script></body></html>
